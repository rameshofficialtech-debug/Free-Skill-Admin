<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students | Skill Hub Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="admin-style.css"></head><body data-page="students"><main class="main"><section class="stats" id="studentStats"></section><article class="panel"><div class="panel-head"><div><h2>All Students</h2><p>Search profiles, monitor progress, and control account access</p></div><button class="primary-btn" data-open="studentModal"><i class="fa-solid fa-user-plus"></i> Add student</button></div><div class="toolbar"><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="studentSearch" placeholder="Search name, email, phone, or plan"></label><select id="studentStatus"><option value="all">All statuses</option><option value="active">Active</option><option value="banned">Banned</option></select></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Phone</th><th>Subscription</th><th>Progress</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="studentsBody"></tbody></table></div></article></main><div class="modal" id="studentModal"><div class="modal-card"><div class="modal-head"><h2>Student details</h2><button class="close-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><form id="studentForm" data-entity="student"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Plan</label><select name="plan"><option>Free Trial</option><option>Monthly</option><option>3 Months</option><option>6 Months</option></select></div><div class="field"><label>Progress (%)</label><input name="progress" type="number" min="0" max="100" value="0"></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="banned">Banned</option></select></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close>Cancel</button><button class="primary-btn">Save student</button></div></form></div></div><script src="admin-script.js"></script></body></html>
