<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates | Skill Hub Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="admin-style.css"></head><body data-page="certificates"><main class="main"><section class="stats" id="certificateStats"></section><article class="panel"><div class="panel-head"><div><h2>Certificate Providers</h2><p>Manage provider details, logos, and free or paid badges</p></div><button class="primary-btn" data-open="certificateModal"><i class="fa-solid fa-plus"></i> Add provider</button></div><div class="toolbar"><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="certificateSearch" placeholder="Search provider or type"></label></div><div class="table-wrap"><table><thead><tr><th>Provider</th><th>Badge</th><th>Certificates Issued</th><th>Status</th><th>Actions</th></tr></thead><tbody id="certificatesBody"></tbody></table></div></article></main><div class="modal" id="certificateModal"><div class="modal-card"><div class="modal-head"><h2>Certificate provider</h2><button class="close-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><form id="certificateForm" data-entity="certificate"><div class="form-grid"><div class="field full"><label>Provider name</label><input name="name" required></div><div class="field"><label>Badge</label><select name="type"><option value="free">Free</option><option value="paid">Paid</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="draft">Hidden</option></select></div><div class="field full"><label>Website</label><input name="website" type="url" placeholder="https://" required></div><div class="field"><label>Logo initials</label><input name="logo" maxlength="4" placeholder="IBM"></div><div class="field"><label>Upload logo</label><input name="logoFile" type="file" accept="image/*"></div></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close>Cancel</button><button class="primary-btn">Save provider</button></div></form></div></div><script src="admin-script.js"></script></body></html>
