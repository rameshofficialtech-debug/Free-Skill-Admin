<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | Skill Hub Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="admin-style.css"></head><body data-page="courses"><main class="main"><section class="stats" id="courseStats"></section><article class="panel"><div class="panel-head"><div><h2>Course Catalog</h2><p>Create, publish, feature, and maintain learning links</p></div><button class="primary-btn" data-open="courseModal"><i class="fa-solid fa-plus"></i> Add course</button></div><div class="toolbar"><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="courseSearch" placeholder="Search course or category"></label><select id="courseCategory"><option value="all">All categories</option><option>Development</option><option>AI &amp; ML</option><option>Data Science</option><option>Design</option><option>Marketing</option></select></div><div class="table-wrap"><table><thead><tr><th>Course</th><th>Category</th><th>Duration</th><th>Learners</th><th>Certificate</th><th>Featured</th><th>Status</th><th>Actions</th></tr></thead><tbody id="coursesBody"></tbody></table></div></article></main><div class="modal" id="courseModal"><div class="modal-card"><div class="modal-head"><h2>Course editor</h2><button class="close-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><form id="courseForm" data-entity="course"><div class="form-grid"><div class="field full"><label>Course title</label><input name="title" required></div><div class="field"><label>Category</label><select name="category"><option>Development</option><option>AI &amp; ML</option><option>Data Science</option><option>Design</option><option>Marketing</option></select></div><div class="field"><label>Duration</label><input name="duration" placeholder="30 Days" required></div><div class="field full"><label>Course link</label><input name="link" type="url" placeholder="https://" required></div><div class="field"><label>Thumbnail</label><input name="thumbnail" type="file" accept="image/*"></div><div class="field"><label>Status</label><select name="status"><option value="published">Published</option><option value="draft">Draft</option></select></div><label class="check-row"><input name="certificate" type="checkbox"> Certificate available</label><label class="check-row"><input name="featured" type="checkbox"> Featured course</label></div><div class="modal-actions"><button type="button" class="secondary-btn" data-close>Cancel</button><button class="primary-btn">Save course</button></div></form></div></div><script src="admin-script.js"></script></body></html>
